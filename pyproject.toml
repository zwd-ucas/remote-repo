[project]
name = "story-dubbing-workbench"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "dashscope>=1.25.5",
    "fastapi>=0.115",
    "imageio-ffmpeg>=0.4.9",
    "openai>=1.0",
    "pydub>=0.25.1",
    "requests>=2.32",
    "uvicorn>=0.30",
    "yt-dlp>=2026.03.17",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_story_pipeline_*.py"]
